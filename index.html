<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зубрик</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #060d1f;
  --surface: #0c1528;
  --card:    #111e35;
  --border:  #1c2e50;
  --text:    #e2e8f0;
  --muted:   #4a6080;
  --accent:  #34d399;
  --pulse:   #34d39920;
}

*{box-sizing:border-box;margin:0;padding:0}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
body::before {
  content:'';
  position:fixed;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 8%  15%, rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px   1px   at 25%  5%, rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 42% 30%, rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px   1px   at 63%  8%, rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px   1px   at 80% 22%, rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 91%  6%, rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(1px   1px   at 17% 70%, rgba(255,255,255,.25) 0%,transparent 100%),
    radial-gradient(1px   1px   at 55% 82%, rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 76% 60%, rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px   1px   at 95% 75%, rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px   1px   at 33% 92%, rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1px   1px   at 5%  48%, rgba(255,255,255,.2) 0%,transparent 100%);
  pointer-events:none;z-index:0;
}

.card {
  position:relative;z-index:1;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:28px;
  padding:24px 20px 20px;
  max-width:360px;width:100%;
  box-shadow: 0 0 80px var(--pulse);
  transition: box-shadow .6s;
}

.header {display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.pet-name {font-size:1.6rem;font-weight:900;letter-spacing:-.5px;}
.level-badge {
  background:var(--border);border-radius:20px;
  padding:3px 10px;font-size:.75rem;font-weight:700;color:var(--accent);
  transition:color .4s;
}

.stage {
  position:relative;width:180px;height:180px;
  margin:12px auto 16px;
}
.creature {
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.82) translateY(6px);
  transition:opacity .3s,transform .3s;
  pointer-events:none;
}
.creature.visible {opacity:1;transform:scale(1) translateY(0);}
.creature svg {width:100%;height:100%;overflow:visible;}

.bubble {
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:16px 16px 16px 4px;
  padding:8px 12px 8px 20px;
  font-size:.82rem;font-weight:700;color:var(--text);
  min-height:38px;
  margin-bottom:14px;
  transition:all .3s;
  position:relative;
}
.bubble::before {
  content:'💬';position:absolute;left:4px;top:50%;
  transform:translateY(-50%);font-size:.8rem;
}

.stats {display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.stat {display:flex;align-items:center;gap:8px;}
.stat-icon {font-size:1rem;width:20px;text-align:center;}
.stat-label {font-size:.72rem;color:var(--muted);width:56px;flex-shrink:0;}
.bar-track {
  flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden;
}
.bar-fill {
  height:100%;border-radius:99px;
  transition:width .6s cubic-bezier(.34,1.56,.64,1), background .4s;
}
.bar-hunger { background: linear-gradient(90deg,#fb923c,#fbbf24); }
.bar-mood   { background: linear-gradient(90deg,#34d399,#6ee7b7); }
.bar-energy { background: linear-gradient(90deg,#818cf8,#a5b4fc); }
.bar-fill.low { background: #f87171 !important; }
.stat-val {font-size:.7rem;color:var(--muted);width:26px;text-align:right;font-variant-numeric:tabular-nums;}

.buttons {display:flex;flex-direction:column;gap:8px;}
.btn {
  border:2px solid transparent;border-radius:14px;
  padding:12px 16px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;
  cursor:pointer;color:#fff;
  position:relative;overflow:hidden;
  transition:transform .12s,box-shadow .2s,border-color .3s;
}
.btn:hover  {transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4);}
.btn:active {transform:scale(.97);box-shadow:none;}
.btn.active {border-color:rgba(255,255,255,.55);}
.btn-happy  {background:linear-gradient(135deg,#059669,#34d399);}
.btn-hungry {background:linear-gradient(135deg,#c2410c,#fb923c);}
.btn-sleep  {background:linear-gradient(135deg,#4338ca,#818cf8);}

.ripple {
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.35);
  transform:scale(0);animation:rippleAnim .5s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim {to{transform:scale(4);opacity:0;}}

.float-text {
  position:fixed;font-size:1.6rem;
  pointer-events:none;opacity:0;
  animation:floatUp .85s ease-out forwards;
  z-index:999;
}
@keyframes floatUp {
  0%  {opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-70px) scale(1.4);}
}

/* Per-state accent */
.state-happy  { --accent:#34d399; --pulse:#34d39920; }
.state-hungry { --accent:#fb923c; --pulse:#fb923c20; }
.state-sleep  { --accent:#818cf8; --pulse:#818cf820; }

/* Creature animations */
.anim-bounce  {animation:bounce  1.1s ease-in-out infinite;}
.anim-shake   {animation:shake   .45s ease-in-out infinite;}
.anim-breathe {animation:breathe 3.2s ease-in-out infinite;}

@keyframes bounce {
  0%,100%{transform:translateY(0);}
  45%    {transform:translateY(-12px);}
  65%    {transform:translateY(-7px);}
}
@keyframes shake {
  0%,100%{transform:translateX(0);}
  25%    {transform:translateX(-5px);}
  60%    {transform:translateX(5px);}
  80%    {transform:translateX(-2px);}
}
@keyframes breathe {
  0%,100%{transform:scale(1);}
  50%    {transform:scale(1.07);}
}

.zzz {animation:zfloat 2.8s ease-in infinite;opacity:0;}
.zzz:nth-child(2){animation-delay:.93s;}
.zzz:nth-child(3){animation-delay:1.86s;}
@keyframes zfloat {
  0%  {opacity:0;transform:translateY(0) scale(.7);}
  18% {opacity:1;}
  85% {opacity:.5;}
  100%{opacity:0;transform:translateY(-40px) scale(1.1);}
}

.spark {animation:sparkle 1.5s ease-in-out infinite;opacity:0;}
.spark:nth-child(2){animation-delay:.5s;}
.spark:nth-child(3){animation-delay:1s;}
@keyframes sparkle {
  0%,100%{opacity:0;transform:scale(.4);}
  50%    {opacity:1;transform:scale(1);}
}

.sweat {animation:sweatDrop 1.2s ease-in infinite;opacity:0;}
.sweat:nth-child(2){animation-delay:.6s;}
@keyframes sweatDrop {
  0%  {opacity:0;transform:translateY(-4px);}
  30% {opacity:.9;}
  100%{opacity:0;transform:translateY(14px);}
}
</style>
</head>
<body>

<div class="card state-happy" id="card">
  <div class="header">
    <div class="pet-name">Зубрик</div>
    <div class="level-badge" id="level-badge">Ур. 1</div>
  </div>

  <div class="bubble" id="bubble">Привет! Я рад тебя видеть! 👋</div>

  <div class="stage">
    <!-- HAPPY -->
    <div class="creature visible" id="c-happy">
      <svg viewBox="-12 -12 104 120" xmlns="http://www.w3.org/2000/svg">
        <g class="spark"><polygon points="0,-8 2,0 10,0 4,5 6,13 0,8 -6,13 -4,5 -10,0 -2,0" fill="#fde68a" transform="translate(-4,12) scale(.75)"/></g>
        <g class="spark"><polygon points="0,-8 2,0 10,0 4,5 6,13 0,8 -6,13 -4,5 -10,0 -2,0" fill="#fde68a" transform="translate(82,20) scale(.6)"/></g>
        <g class="spark"><polygon points="0,-8 2,0 10,0 4,5 6,13 0,8 -6,13 -4,5 -10,0 -2,0" fill="#fde68a" transform="translate(42,-8) scale(.65)"/></g>
        <ellipse cx="14" cy="15" rx="13" ry="15" fill="#059669"/>
        <ellipse cx="66" cy="15" rx="13" ry="15" fill="#059669"/>
        <ellipse cx="14" cy="16" rx="8"  ry="9"  fill="#34d399"/>
        <ellipse cx="66" cy="16" rx="8"  ry="9"  fill="#34d399"/>
        <ellipse cx="40" cy="58" rx="34" ry="36" fill="#34d399"/>
        <ellipse cx="17" cy="66" rx="9" ry="5" fill="#f87171" opacity=".4"/>
        <ellipse cx="63" cy="66" rx="9" ry="5" fill="#f87171" opacity=".4"/>
        <ellipse cx="27" cy="50" rx="9" ry="10" fill="#064e3b"/>
        <ellipse cx="53" cy="50" rx="9" ry="10" fill="#064e3b"/>
        <ellipse cx="25" cy="47" rx="3.5" ry="3.5" fill="#fff"/>
        <ellipse cx="51" cy="47" rx="3.5" ry="3.5" fill="#fff"/>
        <path d="M22 72 Q40 92 58 72" stroke="#064e3b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="40" cy="93" rx="20" ry="8" fill="#059669"/>
      </svg>
    </div>

    <!-- HUNGRY -->
    <div class="creature" id="c-hungry">
      <svg viewBox="-12 -12 110 124" xmlns="http://www.w3.org/2000/svg">
        <g class="sweat"><ellipse cx="72" cy="20" rx="4" ry="7" fill="#93c5fd"/></g>
        <g class="sweat"><ellipse cx="79" cy="30" rx="3" ry="5" fill="#93c5fd"/></g>
        <ellipse cx="14" cy="20" rx="11" ry="13" fill="#b45309"/>
        <ellipse cx="66" cy="20" rx="11" ry="13" fill="#b45309"/>
        <ellipse cx="14" cy="22" rx="6.5" ry="8" fill="#fb923c"/>
        <ellipse cx="66" cy="22" rx="6.5" ry="8" fill="#fb923c"/>
        <ellipse cx="40" cy="60" rx="34" ry="35" fill="#fb923c"/>
        <ellipse cx="27" cy="50" rx="8" ry="8" fill="#7c2d12"/>
        <ellipse cx="53" cy="50" rx="8" ry="8" fill="#7c2d12"/>
        <path d="M21 48 Q27 43 33 48" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M47 48 Q53 43 59 48" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="20" cy="60" rx="3.5" ry="5" fill="#93c5fd" opacity=".75"/>
        <ellipse cx="40" cy="77" rx="13" ry="11" fill="#7c2d12"/>
        <ellipse cx="40" cy="82" rx="8"  ry="6"  fill="#f87171"/>
        <ellipse cx="40" cy="86" rx="5"  ry="3.5" fill="#fca5a5"/>
        <ellipse cx="40" cy="93" rx="20" ry="8" fill="#b45309"/>
      </svg>
    </div>

    <!-- SLEEP -->
    <div class="creature" id="c-sleep">
      <svg viewBox="-12 -12 110 124" xmlns="http://www.w3.org/2000/svg">
        <text class="zzz" x="60" y="28" font-size="18" fill="#818cf8" font-weight="900" font-family="Nunito,sans-serif">Z</text>
        <text class="zzz" x="70" y="12" font-size="13" fill="#a5b4fc" font-weight="900" font-family="Nunito,sans-serif">Z</text>
        <text class="zzz" x="78"  y="1" font-size="10" fill="#c7d2fe" font-weight="900" font-family="Nunito,sans-serif">Z</text>
        <ellipse cx="14" cy="22" rx="10" ry="12" fill="#3730a3"/>
        <ellipse cx="66" cy="22" rx="10" ry="12" fill="#3730a3"/>
        <ellipse cx="14" cy="24" rx="6"  ry="7"  fill="#818cf8"/>
        <ellipse cx="66" cy="24" rx="6"  ry="7"  fill="#818cf8"/>
        <ellipse cx="40" cy="60" rx="34" ry="36" fill="#4f46e5"/>
        <path d="M17 50 Q27 41 37 50" stroke="#1e1b4b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M43 50 Q53 41 63 50" stroke="#1e1b4b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M32 73 Q40 78 48 73" stroke="#1e1b4b" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="40" cy="93" rx="28" ry="9" fill="#3730a3" opacity=".75"/>
        <ellipse cx="40" cy="94" rx="24" ry="6" fill="#4f46e5"/>
      </svg>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="stat-icon">🍎</span>
      <span class="stat-label">Сытость</span>
      <div class="bar-track"><div class="bar-fill bar-hunger" id="bar-hunger" style="width:80%"></div></div>
      <span class="stat-val" id="val-hunger">80</span>
    </div>
    <div class="stat">
      <span class="stat-icon">😊</span>
      <span class="stat-label">Радость</span>
      <div class="bar-track"><div class="bar-fill bar-mood" id="bar-mood" style="width:70%"></div></div>
      <span class="stat-val" id="val-mood">70</span>
    </div>
    <div class="stat">
      <span class="stat-icon">⚡</span>
      <span class="stat-label">Энергия</span>
      <div class="bar-track"><div class="bar-fill bar-energy" id="bar-energy" style="width:60%"></div></div>
      <span class="stat-val" id="val-energy">60</span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <button class="btn btn-happy active"  id="btn-happy"  onclick="act('happy',event)">🎾 Поиграть</button>
    <button class="btn btn-hungry"        id="btn-hungry" onclick="act('hungry',event)">🍎 Покормить</button>
    <button class="btn btn-sleep"         id="btn-sleep"  onclick="act('sleep',event)">🌙 Уложить спать</button>
  </div>
</div>

<script>
var PHRASES = {
  happy: [
    'Побежали ещё раз! Я могу! 🏃',
    'Это лучший день! Играем? 🎾',
    'Хочу прыгать до звёзд! ✨',
    'Ты мой любимый! Поиграем ещё?',
    'Хвостик сам крутится! 🐾'
  ],
  hungry: [
    'Живот говорит «бурр-р-р»... 🍕',
    'Смотрю на тебя голодными глазами...',
    'Дай хоть кусочек, пожалуйста! 🥺',
    'Есть хочу!! Очень!! Срочно!!',
    'Ммм... чем пахнет? Дай мне! 😮'
  ],
  sleep: [
    'Zzz... хорошо тут... тепло... Zzz',
    'Не буди... я почти на другой планете...',
    'Снится мячик... Zzz 💤',
    'Только ещё пять минут... Zzz',
    'Сон — лучший друг... Zzz 💤'
  ]
};

var EFFECTS = {
  happy:  { hunger: -8,  mood: +15, energy: -12 },
  hungry: { hunger: +25, mood: +8,  energy: +5  },
  sleep:  { hunger: +5,  mood: -5,  energy: +30 }
};

var ANIM = {
  happy:  'anim-bounce',
  hungry: 'anim-shake',
  sleep:  'anim-breathe'
};

var FLOATS = { happy: '🎾', hungry: '🍎', sleep: '😴' };

var STATE_CLASS = {
  happy:  'state-happy',
  hungry: 'state-hungry',
  sleep:  'state-sleep'
};

var state  = 'happy';
var stats  = { hunger: 80, mood: 70, energy: 60 };
var xp     = 0;
var level  = 1;
var phraseIdx = { happy: 0, hungry: 0, sleep: 0 };

function clamp(v) { return Math.max(0, Math.min(100, v)); }

function renderStats() {
  var keys = ['hunger', 'mood', 'energy'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var v = Math.round(stats[k]);
    var bar = document.getElementById('bar-' + k);
    var val = document.getElementById('val-' + k);
    bar.style.width = v + '%';
    val.textContent = v;
    bar.classList.toggle('low', v < 25);
  }
}

function renderBubble(s) {
  var list = PHRASES[s];
  var idx = phraseIdx[s] % list.length;
  phraseIdx[s]++;
  document.getElementById('bubble').textContent = list[idx];
}

function renderLevel() {
  document.getElementById('level-badge').textContent = 'Ур. ' + level;
}

function spawnFloat(emoji, btn) {
  var r = btn.getBoundingClientRect();
  var el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = emoji;
  el.style.left = (r.left + r.width / 2 - 14) + 'px';
  el.style.top  = r.top + 'px';
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 900);
}

function addRipple(btn, e) {
  var r    = btn.getBoundingClientRect();
  var size = Math.max(r.width, r.height);
  var rip  = document.createElement('div');
  rip.className = 'ripple';
  rip.style.width  = size + 'px';
  rip.style.height = size + 'px';
  rip.style.left   = (e.clientX - r.left - size / 2) + 'px';
  rip.style.top    = (e.clientY - r.top  - size / 2) + 'px';
  btn.appendChild(rip);
  setTimeout(function() { rip.remove(); }, 600);
}

function applyStateStyle(newState) {
  var card = document.getElementById('card');
  // remove old state classes
  card.classList.remove('state-happy', 'state-hungry', 'state-sleep');
  card.classList.add(STATE_CLASS[newState]);
}

function act(newState, e) {
  addRipple(e.currentTarget, e);
  spawnFloat(FLOATS[newState], e.currentTarget);

  // hide old creature + remove animation
  var oldCreature = document.getElementById('c-' + state);
  oldCreature.classList.remove('visible');
  oldCreature.classList.remove(ANIM[state]);

  // deactivate old button
  document.getElementById('btn-' + state).classList.remove('active');

  state = newState;

  // show new creature + add animation
  var newCreature = document.getElementById('c-' + state);
  newCreature.classList.add('visible');
  newCreature.classList.add(ANIM[state]);

  // activate new button
  document.getElementById('btn-' + state).classList.add('active');

  // update card color class
  applyStateStyle(state);

  // apply stat effects
  var d = EFFECTS[newState];
  stats.hunger = clamp(stats.hunger + d.hunger);
  stats.mood   = clamp(stats.mood   + d.mood);
  stats.energy = clamp(stats.energy + d.energy);
  renderStats();

  // xp + level up
  xp += 10;
  var newLevel = Math.floor(xp / 50) + 1;
  if (newLevel > level) {
    level = newLevel;
    renderLevel();
  }

  renderBubble(newState);
}

// Auto-decay every 8 seconds
setInterval(function() {
  stats.hunger = clamp(stats.hunger - 3);
  stats.mood   = clamp(stats.mood   - 1.5);
  renderStats();
  // if starving and not already showing hungry state
  if (stats.hunger < 20 && state !== 'hungry' && state !== 'sleep') {
    var oldCreature = document.getElementById('c-' + state);
    oldCreature.classList.remove('visible');
    oldCreature.classList.remove(ANIM[state]);
    document.getElementById('btn-' + state).classList.remove('active');

    state = 'hungry';
    var newCreature = document.getElementById('c-hungry');
    newCreature.classList.add('visible');
    newCreature.classList.add(ANIM['hungry']);
    document.getElementById('btn-hungry').classList.add('active');
    applyStateStyle('hungry');
    renderBubble('hungry');
  }
}, 8000);

// init
applyStateStyle('happy');
document.getElementById('c-happy').classList.add(ANIM['happy']);
renderStats();
renderBubble('happy');
renderLevel();
</script>
</body>
</html>
