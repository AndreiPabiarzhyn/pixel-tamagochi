<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заготовка питомца</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#040817; --card:#0d1428; --border:#1e293b;
  --text:#e2e8f0; --muted:#7c8aa5; --accent:#34d399;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:64px 16px 32px;
}
.lang-bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(4,8,23,.75); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
}
.lb {
  padding:4px 14px; border-radius:20px;
  border:1px solid var(--border); background:none;
  color:var(--muted); font-family:'Nunito',sans-serif;
  font-size:13px; font-weight:700; cursor:pointer;
  transition:.18s; letter-spacing:.03em;
}
.lb:hover { border-color:#818cf8; color:#818cf8; }
.lb.on { background:var(--accent); border-color:var(--accent); color:#fff; }

h1 { font-size:24px; font-weight:800; text-align:center; margin-bottom:8px; }
.sub { color:var(--muted); font-size:15px; text-align:center; max-width:520px; margin-bottom:28px; }

.grid {
  display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
  width:100%; max-width:760px;
}
.item {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:20px; padding:18px 16px 16px;
  width:220px; display:flex; flex-direction:column; align-items:center;
}
.item img {
  width:150px; height:150px;
  image-rendering:pixelated;
  background:#0a1020; border-radius:12px;
}
.fname {
  font-family:ui-monospace,'Courier New',monospace;
  font-size:14px; color:var(--accent); font-weight:700;
  margin:12px 0 10px; word-break:break-all; text-align:center;
}
.dl {
  display:block; width:100%; text-align:center;
  padding:10px 0; border-radius:12px;
  background:var(--accent); color:#04240f;
  font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
  text-decoration:none; transition:.18s;
}
.dl:hover { filter:brightness(1.12); }
.note {
  margin-top:26px; max-width:520px; text-align:center;
  color:var(--muted); font-size:13px; line-height:1.55;
}
</style>
</head>
<body>

<div class="lang-bar" id="langBar"></div>

<h1 id="ttl">Заготовка питомца</h1>
<p class="sub" id="sub">Потерял рисунок с прошлого урока? Скачай три готовых состояния и работай с ними.</p>

<div class="grid">
  <div class="item">
    <img src="zagotovka/pet_happy.png" alt="Довольный питомец">
    <div class="fname">pet_happy.png</div>
    <a class="dl" href="zagotovka/pet_happy.png" download="pet_happy.png" data-dl>Скачать</a>
  </div>
  <div class="item">
    <img src="zagotovka/pet_hungry.png" alt="Голодный питомец">
    <div class="fname">pet_hungry.png</div>
    <a class="dl" href="zagotovka/pet_hungry.png" download="pet_hungry.png" data-dl>Скачать</a>
  </div>
  <div class="item">
    <img src="zagotovka/pet_sleep.png" alt="Спящий питомец">
    <div class="fname">pet_sleep.png</div>
    <a class="dl" href="zagotovka/pet_sleep.png" download="pet_sleep.png" data-dl>Скачать</a>
  </div>
</div>

<p class="note" id="note">Имена файлов менять нельзя — они попадут в промпт для Aiko слово в слово.</p>

<script>
var LANG_ORDER = ['EN','RU','ES','ID','IT','TR','PL','PT','AR'];

var T = {
  EN: { dir:'ltr', ttl:'Pet Starter Pack', sub:'Lost your drawing from last lesson? Download these three ready-made states and work with them.', dl:'Download', note:'Do not rename the files — they go into the prompt for Aiko word for word.' },
  RU: { dir:'ltr', ttl:'Заготовка питомца', sub:'Потерял рисунок с прошлого урока? Скачай три готовых состояния и работай с ними.', dl:'Скачать', note:'Имена файлов менять нельзя — они попадут в промпт для Aiko слово в слово.' },
  ES: { dir:'ltr', ttl:'Mascota de repuesto', sub:'¿Perdiste tu dibujo de la clase anterior? Descarga estos tres estados listos y trabaja con ellos.', dl:'Descargar', note:'No cambies los nombres de los archivos — irán en el prompt para Aiko palabra por palabra.' },
  ID: { dir:'ltr', ttl:'Paket Awal Hewan', sub:'Kehilangan gambarmu dari pelajaran lalu? Unduh tiga keadaan siap pakai ini dan gunakan.', dl:'Unduh', note:'Jangan ubah nama file — nama itu masuk ke prompt untuk Aiko kata demi kata.' },
  IT: { dir:'ltr', ttl:'Cucciolo di riserva', sub:'Hai perso il disegno della lezione scorsa? Scarica questi tre stati pronti e lavora con loro.', dl:'Scarica', note:'Non rinominare i file — finiranno nel prompt per Aiko parola per parola.' },
  TR: { dir:'ltr', ttl:'Hazır Evcil Hayvan', sub:'Geçen dersteki çizimini mi kaybettin? Bu üç hazır durumu indir ve onlarla çalış.', dl:'İndir', note:'Dosya adlarını değiştirme — Aiko için yazacağın komuta harfi harfine girecekler.' },
  PL: { dir:'ltr', ttl:'Zapasowy pupil', sub:'Zgubiłeś rysunek z poprzedniej lekcji? Pobierz te trzy gotowe stany i pracuj na nich.', dl:'Pobierz', note:'Nie zmieniaj nazw plików — trafią do promptu dla Aiko słowo w słowo.' },
  PT: { dir:'ltr', ttl:'Mascote de reserva', sub:'Perdeste o teu desenho da aula passada? Descarrega estes três estados prontos e trabalha com eles.', dl:'Descarregar', note:'Não mudes os nomes dos ficheiros — vão para o prompt do Aiko palavra por palavra.' },
  AR: { dir:'rtl', ttl:'حزمة الحيوان الجاهزة', sub:'أضعت رسمك من الدرس الماضي؟ نزّل هذه الحالات الثلاث الجاهزة واعمل بها.', dl:'تنزيل', note:'لا تغيّر أسماء الملفات — ستدخل في الأمر الموجّه لـ Aiko حرفياً.' }
};

function setLang(l) {
  var t = T[l];
  document.documentElement.setAttribute('dir', t.dir);
  document.getElementById('langBar').innerHTML = LANG_ORDER.map(function(code) {
    return '<button class="lb' + (code === l ? ' on' : '') + '" onclick="setLang(\'' + code + '\')">' + code + '</button>';
  }).join('');
  document.getElementById('ttl').textContent  = t.ttl;
  document.getElementById('sub').textContent  = t.sub;
  document.getElementById('note').textContent = t.note;
  var btns = document.querySelectorAll('[data-dl]');
  for (var i = 0; i < btns.length; i++) btns[i].textContent = t.dl;
}

setLang('EN');
</script>
</body>
</html>
